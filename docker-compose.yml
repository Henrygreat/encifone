name: clientos-ai

# Production/Coolify base file. Deliberately has NO `postgres` service:
# production uses a separately-provisioned Coolify-managed PostgreSQL 18 +
# pgvector instance (DATABASE_URL points at it) — see docs/DEPLOYMENT.md §4.
# Redis publishes no host port here, so it's reachable only from the other
# containers on this compose network, never from the public internet.
#
# Every variable each service needs is listed EXPLICITLY below via `${VAR}`
# interpolation — deliberately not via `env_file:`. Coolify's Docker Compose
# env-var handling has a documented history of `env_file` entries being
# auto-injected/overridden/rescoped in ways that can silently drop a
# variable for one service but not another (see docs/DEPLOYMENT.md §4 and
# docs/DECISION_LOG.md) — that failure class matched exactly what this repo
# saw in an earlier deployment attempt. `${VAR}` interpolation reads from
# whatever Coolify (or local `.env`) puts in the project directory's `.env`
# for compose itself — not from a container's own `env_file:` — which is
# the one mechanism Coolify's own docs describe as always working the same
# way in every version.
#
# For local development, run with the local override added:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# (or `pnpm docker:local` — see package.json), which adds a local
# PostgreSQL 18 + pgvector container and republishes ports for host access.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: deps
    environment:
      # Only what `prisma migrate deploy` actually reads — nothing else.
      DATABASE_URL: ${DATABASE_URL}
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379 # internal service name, constant across environments — never from ambient env
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379 # internal service name, constant across environments — never from ambient env
      # The worker doesn't use AUTH_SECRET/APP_URL, but it imports the same
      # shared src/lib/env.ts module as the app (for REDIS_URL), which
      # eagerly validates the WHOLE env schema on import — so these two
      # must be present here too, or the worker crashes on startup. See
      # docs/DEPLOYMENT.md §4 and docs/DECISION_LOG.md.
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  redis_data:
