name: clientos-ai

# Production/Coolify base file. Deliberately has NO `postgres` service:
# production uses a separately-provisioned Coolify-managed PostgreSQL 18 +
# pgvector instance (DATABASE_URL points at it) — see docs/DEPLOYMENT.md §4.
# Redis publishes no host port here, so it's reachable only from the other
# containers on this compose network, never from the public internet.
#
# For local development, run with the local override added:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# (or `pnpm docker:local` — see package.json), which adds a local
# PostgreSQL 18 + pgvector container and republishes ports for host access.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: deps
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379  # unused by `prisma migrate deploy`, set for consistency
    # Direct binary call — `pnpm exec` would otherwise make outbound
    # registry calls on every run just to verify the lockfile.
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379  # internal service name, constant across environments
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379  # internal service name, constant across environments
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  redis_data:
